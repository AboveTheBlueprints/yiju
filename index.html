<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>一句</title>
<style>
  body { background:#f4efe4; color:#2b2620; font-family: "PingFang SC","Noto Serif SC","Songti SC",serif; margin:0; }
  main { max-width: 34em; margin: 0 auto; padding: 3em 1.4em 6em; line-height: 1.95; font-size: 18px; }
  p { margin: 0 0 .9em; }
  .q { color:#8a7f70; font-size: 15px; }
  .end { margin-top: 1.6em; padding-top: 1em; border-top: 1px solid #d8cfbf; color:#5a5045; }
  .you { color:#7a3b1d; }
  #box { margin-top: 1.2em; display:flex; gap:.6em; align-items:center; }
  #in { font-size: 22px; width: 4em; padding: .2em .4em; border: none; border-bottom: 2px solid #2b2620; background: transparent; font-family: inherit; outline: none; }
  button { font-family: inherit; font-size: 15px; background: none; border: 1px solid #8a7f70; color:#5a5045; padding: .2em .9em; cursor: pointer; }
  #said { margin-top: 3em; color:#8a7f70; font-size: 15px; }
  #said span { display:inline-block; margin-right:.6em; color:#5a5045; }
  .fade { animation: f 1.2s ease both; }
  @keyframes f { from { opacity:0 } to { opacity:1 } }
</style>
</head>
<body>
<main>
  <div id="story"></div>
  <div id="box"><input id="in" maxlength="8" autocomplete="off" autofocus><button id="go">说</button></div>
  <div id="again" style="display:none;margin-top:2em"><button id="re">再来一回</button></div>
  <div id="said"></div>
</main>
<script>
const OPEN = [
  '一九九五年秋天，机床厂贴出来一张名单，你的名字在第三张纸的中间。',
  '你是八级钳工。厂里一共四个八级，你最年轻。八级是顶，没有九级。',
  '名单贴出来以后，你搬了个板凳坐到阳台上，坐了两个礼拜。你老婆刘桂芬下班回来问你吃了没有，你说吃了。她去看锅，锅是凉的。',
  '今天她跟单位请了一下午的假，三点钟回来，也搬了个板凳，坐到你旁边。',
  '她看天。你也看天。天上有云，一朵一朵从西边过来。',
  '她憋了半天，不知道该说什么。劝你？劝什么，她自己单位也在传要裁人。骂你？骂不出口。',
  '她指着一朵云，说：',
  '"那朵，四分。"',
];
const ASKED = [
  '"什么四分？"',
  '她转过头来。这是两个礼拜里你头一回问她东西。',
  '"满分十分，它四分。边上都散了，难看。"',
  '她等着你。',
];
const ASKED2 = [ '她说："你听见了。"', ];

// 后面三十一年里，什么都没发生的那一种
const QUIET = [
  '那朵云散了。她坐到四点，站起来进屋淘米。',
  '第二天她没请下来假。第三天她也没去请。',
  '入了冬你还在阳台上坐着，穿着厂里发的棉袄。后来不坐了，是因为冷，不是因为好了。',
  '第二年开春，你去一个亲戚的厂里看大门，看了十四年。',
  '她一个人把日子过得很利索。你们不吵架，也不怎么说话。',
];
const QUIET_END = '二〇二六年十一月，下午三点，一楼的阳台上一个板凳。你坐着，脸朝西边，云一朵一朵过去。屋里她在看电视。谁也不知道你在看什么。';

const E = {
'八': { say:'"八分。"', body:[
  '她转过头来看你。',
  '"它哪里八分？"',
  '"就是八分。"',
  '又过来一朵。"三分。"她说。',
  '"八分。"',
  '"这个也八分？你懂不懂？"',
  '"八分。"',
  '她气得想笑。她想这人是不是脑子坐坏了，可你到底开口了，一下午说了二十几个"八分"，比前两个礼拜加起来说的话都多。',
  '晚上你吃了两碗饭。',
  '第二天三点，她又请了假。第三天她没请下来，下班跑着回来，你已经在阳台上了，旁边给她留着板凳。',
  '后来她买了一本挂历，一天一格，记她的分。你的不用记，你的都是八。',
  '她骂了你三十年没眼光。她知道八是什么。你也知道她知道。谁也不说破。',
], end:'二〇二六年十一月，下午三点，一楼的阳台上两个板凳。她喊"四分"，你说"八分"。楼上有个丫头趴在窗台上偷听，以为你们在吵架。'},

'四': { say:'"四分。"', body:[
  '她愣了一下。她本来是等着你跟她吵的。',
  '又过来一朵。"三分。"',
  '"三分。"',
  '"……这个呢？"她指着一朵挺好看的。',
  '你看了看。"两分。"',
  '她不说话了。她说什么你都跟着，跟你坐在一起，和她一个人坐着，差不多。',
  '第三天她没请假。',
  '那年冬天你跟一个老同事去了东莞，给私人老板修机床，一个月寄一回钱，过年回来一回。你手艺好，老板舍不得放你走，你干到六十二。',
  '阳台后来封上了，装了铝合金窗，她在里头晾衣服。',
], end:'二〇二六年十一月，下午三点，一楼的窗户关着，玻璃上贴着一个福字，去年的，褪成粉的了。窗台后头没有人。'},

'十': { say:'"十分。"', body:[
  '她转过头来："你瞎了？"',
  '"十分。"',
  '"边上都散了你给十分？"她声音高了，"你名字都贴到第三张纸上了，你还十分？你跟我装什么？"',
  '她哭了。不是小声哭，是坐在阳台上，对着对面那栋楼哭。她说她们单位也在传，她说她夜里睡不着，她说这两个礼拜她一个人在厨房里把一锅饭热了三回。',
  '你坐着听。听完了你说："那朵是不好看。"',
  '那天晚上你们说话说到两点，是结婚以后说得最多的一回。',
  '第二年你在路口支了个摊子，修自行车、配钥匙。她下了班来帮你看摊，坐在马扎上算账。',
  '你们再也没给云打过分。用不着了。',
], end:'二〇二六年十一月，下午三点，路口那个修车摊还在，换成你外甥看着。一楼的阳台上晒着一床被子。'},

'九': { say:'"九分。"', body:[
  '她说："哪有九分。"',
  '你没答。八级是顶，没有九级。你说九，是你这两个礼拜头一回说一样没有的东西。',
  '第二天你没坐阳台，去市里新开的职校报了个数控的夜班，跟一屋子二十来岁的坐在一起学敲电脑。四十五了，手指头粗，键盘老按串。',
  '她每天晚上九点去车站接你。',
  '后来你在开发区的台资厂编程序，带过十几个徒弟，他们叫你周工。退下来以后，你在家给外孙讲二进制，外孙不听。',
  '你们家没有挂历，墙上挂的是厂里发的台历。她说过一回："那天你说九分，我还以为你魔怔了。"',
], end:'二〇二六年十一月，下午三点，一楼的阳台上摆着一台旧电脑，早就开不了机了，舍不得扔。阳台上没有人。'},

'零': { say:'"零分。"', body:[
  '她看着你："你说云，还是说你自己？"',
  '你没答。',
  '她不看天了。她看了你一下午。',
  '第二天她没去上班，带你去了三院。挂的哪个科她没跟你说，你也没问。医生开了药，白的小片，一天两回，她看着你吃下去。',
  '那几年，她下午三点都在阳台上，不看云，看你。你好一点，她就跟你说楼下谁家吵架了；你不好，她就坐着，一句话不说，坐到天黑。',
  '你好了。用了四年。',
], end:'二〇二六年十一月，下午三点，一楼的阳台上她在剥毛豆，你在旁边看报。那个药瓶子还在抽屉里，空了好多年了，她留着。'},

'低': { say:null, body:[
  '她一下坐直了："它哪有那么差？"',
  '"有。"',
  '"边上是散了点，中间多厚。"她指给你看，"你看中间。"',
  '你看中间。这是两个礼拜里你头一回顺着她的手指头看一样东西。',
  '她替那朵云说了一下午好话。你说一朵差，她就护一朵。到后来她都不知道自己在护什么，就是不能让你说它不好。',
  '往后就成了这样：你说不好的，她说好。三十一年，她在阳台上给云说了三十一年好话，她的分越打越高，你一直压着。',
], end:'二〇二六年十一月，下午三点，一楼的阳台上，她喊"九分"，你说"两分"。楼上的丫头一直以为周奶奶是这条街上最会夸人的人。'},

'高': { say:null, body:[
  '"它凭什么？"',
  '"中间厚。边上散，是风吹的，不怪它。"',
  '她瞪着你。两个礼拜了，你说的头一句整话，是替一朵云讲情。',
  '你们讲价似的讲了一下午。她四分不松口，你说边上散的那一截有多宽、中间厚的那一块有多大，你是钳工，什么都要讲个公差。',
  '她嫌你烦。可往后每天三点，她都回来。',
  '挂历上一格写两个数，中间画一道杠，像比分。',
], end:'二〇二六年十一月，下午三点，一楼的阳台上两个板凳，一个说"四"，一个说"六"，然后吵为什么。楼上的丫头听不懂，觉得像在开会。'},



'看': { say:'你没看云。你转过头去看她。', body:[
  '她四十三，鬓角有白的了，你以前没注意过。她两只手搁在膝盖上，攥着裤子。',
  '你说："你们单位呢？"',
  '她过了半天才说："也在传。"',
  '你点点头。那朵四分的云过去了，谁也没管它。',
  '第二年她们单位真的裁了，她的名字在第一张纸上。那天下午，是你搬了板凳坐在她旁边。你不会打分，你就给她削苹果，削一个她吃一个。',
], end:'二〇二六年十一月，下午三点，一楼的阳台上两个板凳，中间一个小桌，桌上一盘苹果。皮削成一整条，没断。'},

'笑': { say:'你笑了。', body:[
  '不是那朵云好笑。是四分。你一个八级钳工，在阳台上坐了两个礼拜，等来的是一朵四分的云。',
  '你笑出了声，笑得直咳嗽。',
  '她看着你笑，自己也笑，笑着笑着就哭了。',
  '晚上你吃了两碗饭。第二天你自己出门找活去了。',
  '她以后再没打过分，用不着了。可她记住了，你那天是被一朵四分的云逗笑的。往后你再犟，她就往天上一指："四分。"你就软了。',
], end:'二〇二六年十一月，下午三点，一楼的阳台上，你们在为电费吵架，吵到一半她往天上一指："四分。"你就不说了。'},

'哭': { say:'你哭了。', body:[
  '四十五了，八级，两个礼拜没出声，头一个出来的是这个。',
  '她没劝。她把板凳往你这边挪了挪，挪到挨着，看天。',
  '你们一直坐到天上没有云了。',
  '这件事你们一辈子没提过。',
  '后来的日子跟别人家差不多。找活，带外孙，吵架，和好。',
], end:'二〇二六年十一月，下午三点，一楼的阳台上两个板凳挨着摆，挨得太近了。女儿回娘家说过好几回，碍事，挪开点。她不让挪。'},

'走': { say:'"走。"', body:[
  '她听出来两个意思。一个是你走开，一个是咱们走。',
  '她想了一下，挑了后一个。',
  '她站起来，把你从板凳上拽起来："走就走。"',
  '你们下了楼，顺着街一直走到河边，走到桥上，站了一会儿，又走回来。一路上谁也没说话。',
  '第二天三点她回来，你已经在楼底下等着了。',
  '往后三十一年，下午三点你们都不在家。街上的人都知道，周家两口子三点出门，绕河一圈，五点回来，下雨打伞。',
], end:'二〇二六年十一月，下午三点，一楼的阳台空着，板凳靠墙收着。桥上有两个老人，一个走在前面，一个走在后面，隔着两步。'},

'滚': { say:'"滚。"', body:[
  '她坐着没动。',
  '过了好一会儿她站起来，把板凳搬回屋。门没摔，是轻轻带上的。',
  '那天晚上她去了她妹妹家，住了一个礼拜。',
  '你一个人吃了七天凉饭。第八天你去她妹妹家楼底下站着，站了一下午，没上去。她在楼上窗户里看了你一下午，没下来。',
  '第九天她回来了。你们谁都没提。',
  '这个字你一辈子没再说过。她也一辈子没给云打过分。',
], end:'二〇二六年十一月，下午三点，一楼的阳台上一个板凳，她坐着择菜，你在屋里。你们挺好的，就是下午三点各待各的。'},

'饿': { say:'"饿。"', body:[
  '她一下子站起来了。两个礼拜，你头一回说你要什么。',
  '她跑进厨房，锅碗乱响，十分钟端出来一碗面，卧了两个荷包蛋。你吃完了，她又下了一碗。',
  '那朵云没人管了。',
  '往后她什么事都往吃上想。你不高兴，她做红烧肉；你没找着活，她包饺子。你说过一回不爱吃韭菜，三十一年她一回没包过韭菜的。',
], end:'二〇二六年十一月，下午三点，一楼的阳台封上了，里头放着一台冰柜，冻着几十袋饺子，每袋上贴着一张纸条写着日子，没有一袋是韭菜的。'},

'疼': { say:'"疼。"', body:[
  '"哪儿疼？"',
  '你说不上来是哪儿，就说："腰。"',
  '她给你揉了一下午腰。从那天起你就腰疼了。',
  '腰疼是个好东西，什么都能推。厂里叫你回去签字，腰疼；亲戚叫你去南方，腰疼。她知道你腰不疼。她不说破，给你买膏药，一买买了三十年。',
], end:'二〇二六年十一月，下午三点，一楼的阳台上她一个人坐着。屋里电视开着，柜子顶上一摞膏药，有好几盒没拆。'},

'桂': { say:'"桂芬。"', body:[
  '她愣住了。结婚十九年，你叫她"哎"，叫她"孩子妈"，当着人叫她"我家那个"。',
  '你就叫了这一声，后面没话了。',
  '她等了半天，说："嗯。"',
  '那朵云没人管了。',
  '后来你还是不怎么说话，可你叫她名字了。下岗以后的事你什么都不肯说，这个你肯。',
], end:'二〇二六年十一月，下午三点，一楼的阳台上她喊："建国，收衣服。"你在屋里喊回去："桂芬，你自己收。"'},
'怕': { say:'"怕。"', body:[
  '"怕什么？"',
  '你没说。你说不上来是怕没钱，怕人家看，还是怕往后每天都是这么一个下午。',
  '她说："我也怕。"',
  '你们俩坐着怕了一下午。那朵四分的云过去了，后面又来了几朵，谁也没给它们打分。',
  '往后家里有什么事，先说的都是这个字。她单位裁人那年，她进门头一句是："怕。"你说："我也是。"然后坐下来想怎么办。',
], end:'二〇二六年十一月，下午三点，一楼的阳台上两个板凳。她前两天去体检了，单子还没出来。她说："怕。"你说："我也是。"你们接着看云。'},

'陪': { say:'"陪……"', body:[
  '你只说出来一个字。她听懂了。她本来就是来干这个的。',
  '"陪着呢。"她说。',
  '她没再打分，也没让你打。她把板凳往你这边挪了一点，从兜里掏出一把瓜子，嗑一个，往你手心里放一个。',
  '天黑了你们才进屋。',
  '第二天她没请下来假，下班跑着回来，你已经把她的板凳摆好了。',
  '往后三十一年，下午三点你们都在阳台上，什么也不干。别人家阳台晒被子、养花，你们家阳台是两个板凳、一个瓜子盘。',
], end:'二〇二六年十一月，下午三点，一楼的阳台上两个板凳、一个瓜子盘。她嗑一个，往你手心里放一个。瓜子皮在地上堆了一小堆，傍晚她扫。'},

'唉': { say:'你叹了口气。', body:[
  '两个礼拜了，憋着的那口气这才出来，很长。',
  '她没说话。过了一会儿，她也叹了一口。',
  '"那朵，"她又指了指，"四分，没冤枉它吧？"',
  '"没冤枉。"',
  '往后你们家有了一种不用字的说话法。你回家一叹气，她就知道今天不顺；她叹一口，你就去把碗洗了。',
], end:'二〇二六年十一月，下午三点，一楼的阳台上，她叹了口气，你就起身进屋烧水去了。楼上的丫头听着，以为你们什么也没说。'},

'谢': { say:'"谢……"', body:[
  '后半个字她没让你说完。她扭过脸去，看了半天对面的楼，说："谢什么谢。"',
  '她声音有点不对。',
  '那朵四分的云过去了。',
  '这个字你一辈子就说过这一回，还只说了一半。她记了三十一年。吵架吵到最凶的时候，她就把它翻出来："你还欠我半个字呢。"',
], end:'二〇二六年十一月，下午三点，一楼的阳台上，你们在为外孙女的事拌嘴。她说："你还欠我半个字呢。"你说："欠着吧。"'},

'累': { say:'"累。"', body:[
  '她没问你哪儿累。她看了看你，两个礼拜，你的背是弯的。',
  '"累就歇着，"她说，"歇够了再说。"',
  '她没再打分。那天晚上她把你那件厂里的工作服洗了，叠得方方正正，收进柜子。',
  '你歇了一冬，她没催过一回。开春你自己出门找活，她只问了一句："想好了？"',
  '往后谁说一个"累"，另一个就不问了，把家里的事接过去。她更年期那两年说得多，你学会了做饭。',
], end:'二〇二六年十一月，下午三点，一楼的阳台上她靠着躺椅睡着了，身上搭着你的外套。你坐在旁边，屋里电视的声音你给关了。'},

'钱': { say:'"钱。"', body:[
  '她知道你说的是什么。厂里给的那点钱是一次性的，算下来够你们过两年。',
  '"家里还有，"她说，"存折在衣柜第二层，你又不是不知道。"',
  '那天下午你们没看云，在阳台上算账。她拿了个小本一笔一笔列，你在旁边看。有一笔她算错了，你指出来，她骂了你一句，改了。',
  '往后家里的账一直是这么算的：她记，你核。',
], end:'二〇二六年十一月，下午三点，一楼的阳台上她戴着老花镜记账，你在旁边核。那样的小本记满了十一本，在柜子顶上摞着。'},

'烦': { say:'"烦。"', body:[
  '"烦什么？"',
  '你没说。你说不上来是烦那张名单、烦你自己，还是烦她这会儿坐在旁边。',
  '她听出来最后那一样也有。她没走。她说："烦也得坐着，板凳是我搬来的。"',
  '你们就那么坐着，一个烦，一个陪着。',
  '往后你一烦就不说话，她就搬个板凳过来坐着，不劝也不走。',
], end:'二〇二六年十一月，下午三点，一楼的阳台上两个板凳，谁也没说话。今天烦的是你，她就坐着。'},

};

const MAP = {
  '八':'八','捌':'八',
  '四':'四','肆':'四',
  '十':'十','拾':'十',
  '九':'九','玖':'九',
  '零':'零','〇':'零','无':'零',
  '一':'低','二':'低','两':'低','三':'低','差':'低','丑':'低','烂':'低',
  '五':'高','六':'高','七':'高','凭':'高','冤':'高','低':'高','少':'高',
  '嗯':'嗯','哦':'嗯','噢':'嗯','啊':'嗯','好':'嗯','行':'嗯','唔':'嗯','对':'嗯','是':'嗯','等':'嗯',
  '怕':'怕','慌':'怕','愁':'怕',
  '陪':'陪','坐':'陪','在':'陪','留':'陪',
  '唉':'唉','哎':'唉','叹':'唉','嗐':'唉','诶':'唉',
  '谢':'谢','辛':'谢',
  '看':'看','瞧':'看','望':'看','你':'看',
  '笑':'笑','哈':'笑','呵':'笑','嘿':'笑',
  '哭':'哭','泣':'哭',
  '走':'走','出':'走','去':'走',
  '滚':'滚','闭':'滚',
  '累':'累','乏':'累',
  '钱':'钱',
  '烦':'烦',
  '饿':'饿','吃':'饿','饭':'饿','面':'饿','馋':'饿',
  '疼':'疼','痛':'疼','腰':'疼',
  '桂':'桂','芬':'桂','刘':'桂',
};
const ASK = '什么啥哪谁咋怎何?？吗呢';
const NUMV = {'一':'一','二':'两','两':'两','三':'三','五':'五','六':'六','七':'七'};
const DIG = {'0':'零','1':'一','2':'二','3':'三','4':'四','5':'五','6':'六','7':'七','8':'八','9':'九'};

const story = document.getElementById('story'), inp = document.getElementById('in');
let asked = 0, pressed = 0, echoed = 0, said = JSON.parse(localStorage.getItem('yiju_said') || '[]');

function curly(t) { let o = 0; return t.replace(/"/g, () => (o++ % 2 ? '”' : '“')); }
function para(t, cls) { const p = document.createElement('p'); p.textContent = curly(t); if (cls) p.className = cls + ' fade'; else p.className = 'fade'; story.appendChild(p); return p; }
function showSaid() {
  const d = document.getElementById('said');
  if (!said.length) { d.innerHTML = ''; return; }
  d.innerHTML = '你说过的：' + said.map(s => '<span>' + s + '</span>').join('');
}
function start() {
  story.innerHTML = ''; asked = 0; pressed = 0; echoed = 0; prev = ''; liking = 0;
  OPEN.forEach(t => para(t));
  para('（打一个字。）', 'q');
  document.getElementById('box').style.display = 'flex';
  document.getElementById('again').style.display = 'none';
  inp.value = ''; inp.focus(); showSaid();
}
function finish(endText, ch) {
  const p = para(endText, 'end');
  document.getElementById('box').style.display = 'none';
  document.getElementById('again').style.display = 'block';
  if (ch && !said.includes(ch)) { said.push(ch); localStorage.setItem('yiju_said', JSON.stringify(said)); }
  showSaid();
  window.scrollTo(0, document.body.scrollHeight);
}
function firstChar(s) {
  s = s.trim(); if (!s) return '';
  const m = s.match(/[一-鿿〇]|[0-9]|[?？]/);
  if (!m) return s[0];
  return DIG[m[0]] || m[0];
}
const COMBO = {
  '难熬':'累','难受':'累','心累':'累','好累':'累','太累':'累','撑不':'累',
  '不差':'高','不丑':'高','不难':'高','还行':'高','挺好':'高','好看':'高','冤枉':'高',
  '不好':'低','难看':'低','真丑':'低',
  '谢谢':'谢','多谢':'谢','辛苦':'谢',
  '陪我':'陪','陪你':'陪','别走':'陪','坐会':'陪',
  '走吧':'走','出去':'走','回家':'走','散步':'走',
  '害怕':'怕','我怕':'怕','怕了':'怕',
  '对不':'谢','抱歉':'谢',
  '你呢':'看','你们':'看','你怎':'看',
};
const NEG = '不没别';
function hans(s) { return (s.match(/[一-鿿〇]/g) || []).join(''); }
function lookup(two) {
  if (COMBO[two]) return COMBO[two];
  if (two.length === 2 && NEG.includes(two[0])) {
    const k = MAP[two[1]];
    if (k === '低') return '高';
    if (k === '高') return '低';
  }
  return null;
}
function privateWord(w) {
  [ '她还是没全听懂，不好意思再问了。可你开口了，两个礼拜头一回，还说了两回。',
    '她想了想，又指了一朵："那这朵呢？"',
    '"' + w + '。"',
    '"行，"她说，"你的都是' + w + '。"',
    '晚上你吃了一碗半饭。',
    '后来她买了本挂历，一天一格。她那一格记个数，你那一格就写"' + w + '"。头几年写得歪歪扭扭，后来写顺手了，比她自己的数还好看。',
    '没人问过这个"' + w + '"到底是几分。她不问，你也不说。',
  ].forEach(t => para(t));
  return finish('二〇二六年十一月，下午三点，一楼的阳台上两个板凳。她喊"四分"，你说"' + w + '"。楼上的丫头翻过那本挂历，问过那是什么意思。她说："他的分。"', w);
}
function likeEnd(x) {
  para('"像' + x + '。"', 'you');
  [ '她愣了一下，抬头又看那朵云，看了半天。',
    '"哪儿像' + x + '了？"',
    '你抬手指给她看，这边是什么，那边是什么。',
    '她看出来了，也可能是装看出来了。"像也就四分。"',
    '往后就这么分了工：你说像什么，她给几分。你说得越来越细，像谁家晾的秋裤，像厂里那台老车床，像她年轻时候的辫子，她就笑。',
  ].forEach(t => para(t));
  return finish('二〇二六年十一月，下午三点，一楼的阳台上，你说："像' + x + '。"她说："四分。"楼上的丫头趴在窗台上听，觉得你们俩说话像在对暗号。', '像' + x);
}
function runEntry(key, ch, saidText) {
  const e = E[key];
  let body = e.body;
  if ((key === '低' || key === '高') && !NUMV[ch]) {
    para(saidText || ('"' + ch + '。"'), 'you');
    body = [key === '高' ? '她听出来了，你是嫌她给低了。"那你说，它凭什么多给？"' : '她听出来了，你是嫌她给高了。她一下坐直了："它哪有那么差？"'].concat(e.body.slice(1));
  }
  else if (key === '低' || key === '高') para('"' + NUMV[ch] + '分。"', 'you');
  else if (saidText && e.say.startsWith('"')) para(saidText, 'you');
  else if (ch !== key && e.say.startsWith('"')) para('"' + ch + '。"', 'you');
  else para(e.say, 'you');
  body.forEach(t => para(t));
  if (e.quiet) { QUIET.forEach(t => para(t)); return finish(QUIET_END, ch); }
  finish(e.end, saidText ? saidText.replace(/["。]/g, '') : ch);
}
let prev = '', liking = 0;
function ask() { para('（你还能打一个字。）', 'q'); inp.focus(); }
function go() {
  const raw = inp.value; const s = raw.trim();
  inp.value = '';
  const hs = hans(s);
  let ch = firstChar(s);
  // 她问过"像什么"，这一个字就是像的那样东西
  if (liking) { liking = 0; if (ch) return likeEnd(ch); }
  // 她问回过"X？"，这一个字接着上一个字听
  if (prev) {
    const p = prev; prev = '';
    const two = p + (hs[0] || '');
    const k = hs[0] ? lookup(two) : null;
    if (k) return runEntry(k, hs[0], '"' + two + '。"');
    if (ch && MAP[ch] && MAP[ch] !== '嗯') {
      const k2 = MAP[ch];
      if (E[k2].say && E[k2].say.startsWith('"') && k2 !== '低' && k2 !== '高') return runEntry(k2, ch, '"' + p + '……' + ch + '。"');
      para('"' + p + '……"', 'you'); return runEntry(k2, ch);
    }
    if (!ch || MAP[ch] === '嗯') { para(ch ? '"' + ch + '。"' : '你没往下说。', 'you'); return privateWord(p); }
    para('"' + ch + '。"', 'you');
    return privateWord(hs ? p + hs[0] : p);
  }
  // 一下打了两个字，先看这两个字连起来是不是一句话
  if (hs.length >= 2) {
    if (hs[0] === '像') return likeEnd(hs[1]);
    const k = lookup(hs.slice(0, 2));
    if (k) return runEntry(k, hs[1], '"' + hs.slice(0, 2) + '。"');
  }
  const extra = s.replace(/[\s。，,.!！分]/g, '').length > 1;
  if (!ch || MAP[ch] === '嗯') { // 什么也没说，或者只应了一声
    if (!ch) para('你什么也没说。', 'you'); else para('"' + ch + '。"', 'you');
    if (!pressed) {
      pressed = 1;
      if (!ch) { para('她等了一会儿。那朵云过去了。她又指了一朵："那这朵呢？"'); }
      else { para('她等了一会儿，以为你后面还有话。没有了。'); para('可她听见了。"' + ch + '什么' + ch + '。那这朵呢，几分？"'); }
      return ask();
    }
    para('她不问了。');
    QUIET.forEach(t => para(t));
    return finish(QUIET_END, ch || '（没说）');
  }
  if (extra && !ASK.includes(ch)) para('你两个礼拜没开口了。嗓子里只出来一个字："' + ch + '"。', 'q');
  if (ASK.includes(ch)) {
    if (asked === 0) {
      asked = 1; ASKED.forEach((t,i) => para(t, i===0 ? 'you' : ''));
      return ask();
    }
    para('"' + ch + '？"', 'you'); ASKED2.forEach(t => para(t));
    QUIET.forEach(t => para(t)); return finish(QUIET_END, ch);
  }
  if (ch === '像') { para('"像……"', 'you'); para('她转过头来："像什么？"'); liking = 1; return ask(); }
  const key = MAP[ch];
  if (!key) { // 不认得的字：她问回去，等你往下说
    para('"' + ch + '。"', 'you');
    if (!echoed) {
      echoed = 1; prev = ch;
      para('她转过头来看你："' + ch + '？"');
      para('她没听懂，等你往下说。');
      return ask();
    }
    return privateWord(ch);
  }
  runEntry(key, ch);
}
document.getElementById('go').onclick = go;
inp.addEventListener('keydown', ev => { if (ev.key === 'Enter' && !ev.isComposing) go(); });
document.getElementById('re').onclick = start;
start();
</script>
